<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dashboard" />

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      /* Native iOS Dark Mode Palette */
      --bg: #000000;
      --card-bg: #1c1c1e;
      --card-alt: #2c2c2e;
      --accent: #0a84ff;   /* iOS System Blue */
      --purple: #bf5af2;   /* iOS System Purple */
      --green: #30d158;    /* iOS System Green */
      --orange: #ff9f0a;   /* iOS System Orange */
      --text: #ffffff;
      --subtext: #8e8e93;  /* iOS System Gray */
      --border: #38383a;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-top: 4px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .status {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-top: 2px;
    }
    
    /* Clean iOS Icon Button */
    button.refresh-btn {
      background: var(--card-alt);
      color: var(--accent);
      width: 36px;
      height: 36px;
      border-radius: 18px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.refresh-btn:active { opacity: 0.5; }
    button.refresh-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Dropdowns */
    select.filter-select {
      background: var(--card-bg);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
    }
    .main-dropdown-container {
      margin-bottom: 16px;
    }
    select#mainMonthSelect {
      width: 100%;
      background-color: var(--card-alt);
      font-size: 1rem;
      padding: 12px 16px;
      border-radius: 14px;
    }

    /* 4 KPI Summary Cards */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .stat-card .label {
      font-size: 0.65rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .stat-card .value {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 6px;
      color: var(--accent);
      letter-spacing: -0.2px;
    }
    .stat-card .value.cntr-val { color: var(--text); }
    .stat-card .value.teu-val { color: var(--purple); }
    .stat-card .value.margin-val { color: var(--green); }

    /* Line Chart Summary View */
    .chart-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: none; /* Hidden by default until ALL is selected */
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .chart-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    select.mini-select {
      background: var(--card-alt);
      padding: 6px 30px 6px 10px;
      font-size: 0.75rem;
      border-radius: 8px;
      background-size: 12px;
    }
    canvas {
      width: 100%;
      max-height: 220px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .controls-bar select {
      flex: 1;
    }
    .mini-pills {
      display: flex;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 3px;
    }
    .mini-pill {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .mini-pill.active {
      background: #48484a;
    }

    /* Master Table View */
    .customer-table-wrap {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      padding-bottom: 8px;
    }
    table.cust-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    table.cust-table th {
      color: var(--subtext);
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 14px 10px 10px 10px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.4px;
      font-weight: 600;
    }
    table.cust-table th:first-child { text-align: left; padding-left: 16px; }
    table.cust-table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      font-weight: 600;
    }
    table.cust-table tr:last-child td { border-bottom: none; }
    table.cust-table td:first-child {
      text-align: left;
      padding-left: 16px;
      font-weight: 600;
      color: var(--text);
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Dashboard</h1>
      <div class="status" id="lastUpdated">Updating...</div>
    </div>
    <button class="refresh-btn" onclick="fetchMasterSheet()" ondblclick="window.location.reload(true)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </button>
  </header>

  <!-- Full-Width Month Dropdown -->
  <div class="main-dropdown-container">
    <select id="mainMonthSelect" class="filter-select" onchange="selectMonth(this.value)">
      <option value="ALL">All Months Overview</option>
    </select>
  </div>

  <div class="card-grid">
    <div class="stat-card">
      <div class="label">BOOKINGS</div>
      <div class="value" id="statCount">--</div>
    </div>
    <div class="stat-card">
      <div class="label">CONTAINERS</div>
      <div class="value cntr-val" id="statContainers">--</div>
    </div>
    <div class="stat-card">
      <div class="label">TOTAL TEUs</div>
      <div class="value teu-val" id="statVolume">--</div>
    </div>
    <div class="stat-card">
      <div class="label">EARNING PROFIT</div>
      <div class="value margin-val" id="statMargin">--</div>
    </div>
  </div>

  <!-- Summarized Demographics Line Chart (Visible only when 'ALL' is selected) -->
  <div id="summaryChartContainer" class="chart-container">
    <div class="chart-header">
      <div class="chart-title">Monthly Trends</div>
      <select id="chartMetricSelect" class="filter-select mini-select" onchange="renderLineChart()">
        <option value="teus">TEUs</option>
        <option value="profit">Profit</option>
        <option value="cntrs">Containers</option>
        <option value="bookings">Bookings</option>
      </select>
    </div>
    <canvas id="lineChart"></canvas>
  </div>

  <div class="controls-bar">
    <select class="filter-select" id="groupBySelect" onchange="renderTableData()">
      <option value="party">Group By: Customer</option>
      <option value="pod">Group By: POD (Port)</option>
      <option value="vsl">Group By: Vessel</option>
    </select>
    <div class="mini-pills">
      <button class="mini-pill active" id="sort-teu" onclick="setSortBy('teu')">TEUs</button>
      <button class="mini-pill" id="sort-profit" onclick="setSortBy('profit')">Profit</button>
    </div>
  </div>

  <div class="customer-table-wrap">
    <table class="cust-table">
      <thead>
        <tr>
          <th id="colHeaderName">Customer Name</th>
          <th>Bkgs</th>
          <th>Cntrs</th>
          <th>TEUs</th>
          <th>Profit</th>
        </tr>
      </thead>
      <tbody id="customerTableBody"></tbody>
    </table>
  </div>

  <script>
    // =========================================================================
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    // =========================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpx5kemA_-QV09b_op1YZSkKJtpLG_VSvCxwXf8Is-n2czAdMyxYkXaiYfVC_T2fh9Jw/exec";

    const MONTH_ORDER = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    let dataByMonth = {};
    let activeMonth = "ALL";
    let sortBy = "teu"; 
    let lineChartInstance = null;

    function normalizeMonthName(rawName) {
      const clean = String(rawName || "").trim().toUpperCase();
      for (const m of MONTH_ORDER) {
        if (clean.startsWith(m) || clean.includes(m)) return m;
      }
      return clean;
    }

    function parseNum(val, fallback = 0) {
      if (val === undefined || val === null || val === "") return fallback;
      if (typeof val === "number") return isNaN(val) ? fallback : val;
      const cleaned = String(val).replace(/[^0-9.-]+/g, "");
      const parsed = parseFloat(cleaned);
      return isNaN(parsed) ? fallback : parsed;
    }

    async function fetchMasterSheet() {
      const statusEl = document.getElementById("lastUpdated");
      statusEl.textContent = "Fetching data...";

      try {
        if (APPS_SCRIPT_URL.includes("PASTE_")) {
          throw new Error("Missing Script URL");
        }

        const liveUrl = APPS_SCRIPT_URL + "?_cb=" + new Date().getTime();
        
        const resp = await fetch(liveUrl, { redirect: "follow" });
        const text = await resp.text();
        
        let rawJson;
        try {
          rawJson = JSON.parse(text);
        } catch (parseError) {
          if (text.includes("<!DOCTYPE html>") || text.includes("<html")) {
            throw new Error("Script Blocked: Check sharing permissions");
          }
          throw new Error("Invalid format returned by Google");
        }

        if (rawJson.error) throw new Error("Error: " + rawJson.error);

        dataByMonth = {};
        const sheetNames = Object.keys(rawJson);
        
        if (sheetNames.length === 0) throw new Error("Spreadsheet is empty");

        sheetNames.forEach(sheetName => {
          const rawRows = rawJson[sheetName];
          if (!Array.isArray(rawRows) || rawRows.length < 2) return;

          let headerRowIdx = 0;
          for (let r = 0; r < Math.min(5, rawRows.length); r++) {
            const rowText = rawRows[r].join(" ").toLowerCase();
            if (rowText.includes("booking") || rowText.includes("vsl") || rowText.includes("pod") || rowText.includes("margin") || rowText.includes("party")) {
              headerRowIdx = r;
              break;
            }
          }

          const headers = rawRows[headerRowIdx].map(h => String(h).trim().toLowerCase());
          const findCol = (keywords, fallbackIdx) => {
            const idx = headers.findIndex(h => keywords.some(k => h.includes(k)));
            return idx !== -1 ? idx : fallbackIdx;
          };

          const bookIdx   = findCol(["booking", "bkg", "bl", "sr"], 0);
          const partyIdx  = findCol(["party", "customer", "shipper", "forwarder", "client", "company", "name"], 1);
          const cntrIdx   = findCol(["cntr", "container", "box", "total units", "units"], 5);
          const teuIdx    = findCol(["teu", "vol", "qty", "volume"], 6);
          const podIdx    = findCol(["pod", "port", "dest", "discharge"], 9);
          const vslIdx    = findCol(["vsl", "vessel"], 12);
          const buyIdx    = findCol(["buy", "cost"], -1);
          const sellIdx   = findCol(["sell", "rate"], -1);
          const marginIdx = findCol(["margin", "profit", "earning", "net"], 11);

          const normalizedRows = [];
          for (let i = headerRowIdx + 1; i < rawRows.length; i++) {
            const r = rawRows[i];
            const bookingVal = String(r[bookIdx] || "").trim();
            const partyVal = String(r[partyIdx] || "").trim();

            if (partyVal.toLowerCase().includes("total") || bookingVal.toLowerCase().includes("total")) continue;
            if (!bookingVal && !partyVal) continue;

            const cntrs = parseNum(r[cntrIdx], 0);
            const teus = parseNum(r[teuIdx], 0);
            
            let margin = parseNum(r[marginIdx], NaN);
            if (isNaN(margin)) {
              const buy = parseNum(r[buyIdx], NaN);
              const sell = parseNum(r[sellIdx], NaN);
              margin = (!isNaN(buy) && !isNaN(sell)) ? (sell - buy) * teus : 0;
            }

            normalizedRows.push({
              vsl: String(r[vslIdx] || "UNKNOWN").trim().toUpperCase(),
              party: (partyVal || "UNKNOWN").toUpperCase(),
              cntrs: cntrs,
              teus: teus,
              pod: String(r[podIdx] || "UNKNOWN").trim().toUpperCase(),
              margin: margin
            });
          }

          if (normalizedRows.length > 0) {
            const mKey = normalizeMonthName(sheetName);
            if (!dataByMonth[mKey]) dataByMonth[mKey] = [];
            dataByMonth[mKey] = dataByMonth[mKey].concat(normalizedRows);
          }
        });

        renderMonthDropdown();
        renderTableData();
        renderLineChart(); // Initializes chart if ALL is selected

        const now = new Date();
        statusEl.textContent = `Updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message || "Error fetching data";
      }
    }

    function renderMonthDropdown() {
      const select = document.getElementById("mainMonthSelect");
      const months = Object.keys(dataByMonth).sort((a, b) => {
        const idxA = MONTH_ORDER.indexOf(a);
        const idxB = MONTH_ORDER.indexOf(b);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        return a.localeCompare(b);
      });

      if (activeMonth !== "ALL" && !months.includes(activeMonth)) {
        activeMonth = "ALL";
      }

      let html = `<option value="ALL">All Months Overview</option>`;
      months.forEach(m => {
        html += `<option value="${m}" ${activeMonth === m ? 'selected' : ''}>${m}</option>`;
      });
      select.innerHTML = html;
    }

    function selectMonth(m) {
      activeMonth = m;
      renderTableData();
      
      // Toggle the integrated Line Chart Summary Page visibility
      const chartContainer = document.getElementById("summaryChartContainer");
      if (activeMonth === "ALL") {
        chartContainer.style.display = "block";
        renderLineChart();
      } else {
        chartContainer.style.display = "none";
      }
    }

    function setSortBy(s) {
      sortBy = s;
      ["teu", "profit"].forEach(k => {
        document.getElementById(`sort-${k}`).classList.toggle("active", k === s);
      });
      renderTableData();
    }

    function renderTableData() {
      const groupBy = document.getElementById("groupBySelect").value;
      const headerNameEl = document.getElementById("colHeaderName");

      if (groupBy === "party") headerNameEl.textContent = "Customer Name";
      else if (groupBy === "pod") headerNameEl.textContent = "POD (Port)";
      else headerNameEl.textContent = "Vessel Name";

      let rows = [];
      if (activeMonth === "ALL") {
        Object.values(dataByMonth).forEach(mRows => { rows = rows.concat(mRows); });
      } else {
        rows = dataByMonth[activeMonth] || [];
      }

      let totalBookings = rows.length;
      let totalContainers = 0;
      let totalTEUs = 0;
      let totalProfit = 0;
      const aggregatedMap = {};

      rows.forEach(item => {
        totalContainers += item.cntrs;
        totalTEUs += item.teus;
        totalProfit += item.margin;

        let groupKey = item.party;
        if (groupBy === "pod") groupKey = item.pod;
        if (groupBy === "vsl") groupKey = item.vsl;

        if (!aggregatedMap[groupKey]) {
          aggregatedMap[groupKey] = { name: groupKey, bookings: 0, cntrs: 0, teus: 0, profit: 0 };
        }
        aggregatedMap[groupKey].bookings += 1;
        aggregatedMap[groupKey].cntrs += item.cntrs;
        aggregatedMap[groupKey].teus += item.teus;
        aggregatedMap[groupKey].profit += item.margin;
      });

      document.getElementById("statCount").textContent = totalBookings.toLocaleString();
      document.getElementById("statContainers").textContent = Math.round(totalContainers).toLocaleString();
      document.getElementById("statVolume").textContent = Math.round(totalTEUs).toLocaleString();
      document.getElementById("statMargin").textContent = "$" + Math.round(totalProfit).toLocaleString();

      const sortedArray = Object.values(aggregatedMap).sort((a, b) => {
        return sortBy === "profit" ? (b.profit - a.profit) : (b.teus - a.teus);
      });

      const tableHtml = sortedArray.map(c => `
        <tr>
          <td>${c.name}</td>
          <td style="color: var(--accent);">${c.bookings}</td>
          <td style="color: var(--text);">${Math.round(c.cntrs)}</td>
          <td style="color: var(--purple);">${Math.round(c.teus)}</td>
          <td style="color: var(--green);">$${Math.round(c.profit).toLocaleString()}</td>
        </tr>
      `).join("");

      document.getElementById("customerTableBody").innerHTML = tableHtml || `<tr><td colspan="5" style="text-align:center; color: var(--subtext); padding: 20px;">No data available</td></tr>`;
    }

    // Integrated Line Chart for the "ALL" view Summary
    function renderLineChart() {
      if (activeMonth !== "ALL") return;

      const metric = document.getElementById("chartMetricSelect").value;
      const labels = [];
      const dataPoints = [];

      // Filter to only include months that exist in the data, in calendar order
      const availableMonths = MONTH_ORDER.filter(m => dataByMonth[m]);

      availableMonths.forEach(m => {
        labels.push(m);
        let sum = 0;
        dataByMonth[m].forEach(row => {
          if (metric === 'teus') sum += row.teus;
          else if (metric === 'profit') sum += row.margin;
          else if (metric === 'cntrs') sum += row.cntrs;
          else if (metric === 'bookings') sum += 1;
        });
        dataPoints.push(Math.round(sum));
      });

      const ctx = document.getElementById("lineChart").getContext("2d");
      if (lineChartInstance) lineChartInstance.destroy();

      // Dynamic native iOS colors based on selected metric
      let color = "#0a84ff"; // iOS Blue (Default)
      if (metric === 'profit') color = "#30d158"; // iOS Green
      else if (metric === 'teus') color = "#bf5af2"; // iOS Purple
      else if (metric === 'cntrs') color = "#ff9f0a"; // iOS Orange

      lineChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: metric.toUpperCase(),
            data: dataPoints,
            borderColor: color,
            backgroundColor: color + '26', // 15% opacity fill
            borderWidth: 3,
            pointBackgroundColor: color,
            pointRadius: 4,
            fill: true,
            tension: 0.3 // Smooth curves
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { 
              grid: { color: '#38383a' }, 
              ticks: { color: '#8e8e93', font: { size: 10 } },
              beginAtZero: true
            },
            x: { 
              grid: { display: false }, 
              ticks: { color: '#8e8e93', font: { size: 10 } } 
            }
          }
        }
      });
    }

    // Set chart container to block on initial load
    document.getElementById("summaryChartContainer").style.display = "block";

    setInterval(fetchMasterSheet, 5 * 60 * 1000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchMasterSheet();
    });
    window.addEventListener("DOMContentLoaded", fetchMasterSheet);
  </script>
</body>
</html>
