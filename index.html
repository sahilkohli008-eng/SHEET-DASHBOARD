<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard</title>

  <!-- iOS Status Bar & Caching -->
  <meta name="theme-color" content="#07090e" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dashboard" />

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      /* High-Contrast Neon Accents */
      --accent: #5eead4;      
      --accent-blue: #60a5fa; 
      --purple: #c084fc;      
      --green: #4ade80;
      --orange: #fb923c;
      --pink: #fb7185;
      --red: #f87171;
      
      --text-light: #ffffff;
      --subtext-light: rgba(255, 255, 255, 0.62);

      /* Strict iOS Glassmorphism Tokens */
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
      --glass-border: 0.5px solid rgba(255, 255, 255, 0.15);
      --glass-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 8px 24px rgba(0, 0, 0, 0.4);
      --glass-blur: blur(24px) saturate(180%);
      
      --radius-main: 22px;
      --radius-pill: 14px;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Deep Dark Canvas */
    html, body { background-color: #07090e; color: var(--text-light); }
    body {
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px);
      min-height: 100vh; position: relative; overflow-x: hidden;
    }
    
    /* Ambient Backlight */
    body::before {
      content: ""; position: fixed; top: -15%; left: -15%; width: 130%; height: 130%;
      background: 
        radial-gradient(circle at 18% 22%, rgba(56, 189, 248, 0.14) 0%, transparent 42%),
        radial-gradient(circle at 82% 65%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(45, 212, 191, 0.10) 0%, transparent 45%);
      filter: blur(50px); z-index: -2; pointer-events: none;
    }

    /* Base Glassmorphism */
    .liquid-glass {
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--radius-main);
      color: var(--text-light);
    }
    .liquid-pill { border-radius: var(--radius-pill) !important; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    
    .menu-btn, button.refresh-btn {
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--radius-pill);
      color: var(--text-light); cursor: pointer; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease;
    }
    .menu-btn:active, button.refresh-btn:active { transform: scale(0.95); }
    .menu-btn svg { width: 22px; height: 22px; }
    button.refresh-btn svg { width: 18px; height: 18px; transform-origin: center; }
    
    h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.4px; margin: 0; }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .spinning { animation: spin 1s linear infinite; }

    /* Sidebar Drawer */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 998;
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
    }
    #overlay.active { opacity: 1; visibility: visible; }

    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 78vw; max-width: 320px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-right: 0.5px solid rgba(255, 255, 255, 0.15); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 12px 0 32px rgba(0, 0, 0, 0.5);
      z-index: 999; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: calc(env(safe-area-inset-top) + 20px) 20px 20px; display: flex; flex-direction: column;
    }
    #sidebar.active { transform: translateX(0); }
    
    .sidebar-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
    .sidebar-title-group { display: flex; flex-direction: column; }
    .sidebar-title-group h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; color: var(--text-light); margin: 0; }
    
    .status { font-size: 0.72rem; color: var(--subtext-light); font-weight: 500; margin-top: 4px; }
    
    .close-btn {
      background: var(--glass-bg); border: var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--radius-pill);
      color: var(--text-light); cursor: pointer; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; margin-top: -2px;
    }
    .close-btn svg { width: 18px; height: 18px; }
    
    .sidebar-content { display: flex; flex-direction: column; gap: 18px; }
    
    .filter-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
    
    .filter-label { font-size: 0.7rem; text-transform: uppercase; color: var(--subtext-light); font-weight: 600; letter-spacing: 0.5px; }

    /* Standard Select */
    select.filter-select {
      color: var(--text-light); padding: 12px 36px 12px 14px; font-size: 0.9rem; font-weight: 600;
      outline: none; -webkit-appearance: none; appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgba(255,255,255,0.75)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 12px center; background-size: 15px; width: 100%;
    }
    select.filter-select option { background-color: #07090e; color: #ffffff; }

    /* Custom Searchable Dropdowns */
    .custom-select-wrapper { position: relative; }
    .custom-select-trigger {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgba(255,255,255,0.75)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 12px center; background-size: 15px;
      padding: 12px 36px 12px 14px; color: var(--text-light); font-size: 0.9rem; font-weight: 600;
      cursor: pointer; user-select: none;
    }
    
    .custom-dropdown-menu {
      display: none; flex-direction: column; position: absolute; top: calc(100% + 8px); left: 0; width: 100%;
      background: #0f141e; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 18px; 
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8); z-index: 1000; overflow: hidden;
    }
    .custom-dropdown-menu.active { display: flex; }
    
    .search-input-wrapper { 
      padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); background: #161b26; 
      position: relative; display: flex; align-items: center;
    }
    .search-input-wrapper input {
      width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px; padding: 10px 32px 10px 14px; color: #fff; font-size: 0.9rem; outline: none;
    }
    .search-input-wrapper input::placeholder { color: rgba(255, 255, 255, 0.4); }
    
    /* Interactive Clear Button (X) */
    .clear-search-btn {
      position: absolute;
      right: 18px;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-light);
      transition: background 0.2s, transform 0.1s;
    }
    .clear-search-btn:hover { background: rgba(255,255,255,0.3); }
    .clear-search-btn:active { transform: scale(0.9); }
    .clear-search-btn svg { width: 12px; height: 12px; }
    
    .custom-options-list { max-height: 200px; overflow-y: auto; }
    .custom-option {
      padding: 14px 16px; font-size: 0.85rem; font-weight: 600; color: var(--text-light);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; transition: background 0.2s;
    }
    .custom-option:last-child { border-bottom: none; }
    .custom-option:hover, .custom-option.selected { background: rgba(255, 255, 255, 0.1); color: var(--accent-blue); font-weight: 700; }

    /* Bento KPI Cards Layout */
    .card-row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
    .card-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    .stat-card { padding: 16px; }
    .stat-card.small-card { padding: 14px 12px; }
    
    .stat-card .label-row { display: flex; justify-content: space-between; align-items: center; }
    .stat-card .label { font-size: 0.68rem; color: var(--subtext-light); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .stat-card.small-card .label { font-size: 0.6rem; }
    
    .trend-badge {
      font-size: 0.62rem; padding: 3px 7px; border-radius: var(--radius-pill); font-weight: 700; display: inline-flex; align-items: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
    }
    .stat-card.small-card .trend-badge { font-size: 0.54rem; padding: 2px 5px; }
    .trend-badge.up { color: var(--green); }
    .trend-badge.down { color: var(--red); }
    .trend-badge.neutral { color: var(--subtext-light); }

    .stat-card .value { font-size: 1.65rem; font-weight: 700; margin-top: 8px; letter-spacing: -0.4px; }
    .stat-card.small-card .value { font-size: 1.25rem; margin-top: 6px; }
    
    .stat-card .value.bkg-val { color: var(--accent-blue); }
    .stat-card .value.cntr-val { color: var(--text-light); }
    .stat-card .value.teu-val { color: var(--purple); }
    .stat-card .value.margin-val { color: var(--accent); font-size: 1.7rem; }
    .stat-card .value.gp-val { color: var(--accent-blue); }
    .stat-card .value.hq-val { color: var(--orange); }
    .stat-card .value.spl-val { color: var(--pink); }
    
    .sub-value { font-size: 0.7rem; color: var(--subtext-light); margin-top: 5px; font-weight: 600; letter-spacing: 0.2px; }

    /* Chart Summary */
    .chart-container { padding: 18px; margin-bottom: 20px; display: none; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .chart-title { font-size: 1rem; font-weight: 700; letter-spacing: -0.2px; color: var(--text-light); }
    select.mini-select { padding: 8px 30px 8px 12px; font-size: 0.78rem; width: auto; }
    canvas { width: 100%; max-height: 220px; }

    /* Controls Bar & Physical Switch */
    .controls-bar { margin-bottom: 14px; }
    .controls-top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .controls-top-row select { flex: 1; }
    
    .switch-track {
      display: flex; background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--radius-pill); padding: 3px;
    }
    .switch-btn {
      background: transparent; color: var(--subtext-light); border: 0.5px solid transparent;
      padding: 8px 16px; font-size: 0.8rem; font-weight: 600; border-radius: 11px; cursor: pointer; transition: all 0.2s ease;
    }
    .switch-btn.active {
      color: var(--text-light); background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 100%);
      border: 0.5px solid rgba(255, 255, 255, 0.2); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.25);
    }
    
    /* Master Table */
    .customer-table-wrap { overflow: hidden; padding-bottom: 6px; }
    table.cust-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.cust-table th {
      color: var(--subtext-light); font-size: 0.65rem; text-transform: uppercase; padding: 16px 12px 12px 12px;
      text-align: right; border-bottom: 0.5px solid rgba(255, 255, 255, 0.15); letter-spacing: 0.5px; font-weight: 600;
    }
    table.cust-table th:first-child { text-align: left; padding-left: 18px; }
    table.cust-table td {
      padding: 14px 12px; border-bottom: 0.5px solid rgba(255, 255, 255, 0.07); text-align: right; font-weight: 600; vertical-align: middle;
    }
    table.cust-table tr:last-child td { border-bottom: none; }
    table.cust-table td:first-child {
      text-align: left; padding-left: 18px; font-weight: 600; color: var(--text-light);
      max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cell-main { display: block; font-size: 0.9rem; font-weight: 700; }
    .cell-sub { font-size: 0.65rem; color: var(--subtext-light); margin-top: 3px; font-weight: 500; }
  </style>
</head>
<body>

  <!-- Overlay & Sidebar Drawer -->
  <div id="overlay" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-group">
        <h2>Global Filters</h2>
        <div class="status" id="lastUpdated">Updating...</div>
      </div>
      <button class="close-btn" onclick="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    
    <div class="sidebar-content">
      <div class="filter-group">
        <label class="filter-label">Month Overview</label>
        <select id="mainMonthSelect" class="filter-select liquid-glass liquid-pill" onchange="applyGlobalFilters()">
          <option value="ALL">All Months Overview</option>
        </select>
      </div>
      
      <!-- CUSTOM SEARCHABLE VESSEL DROPDOWN -->
      <div class="filter-group" style="z-index: 100;">
        <label class="filter-label">Vessels</label>
        <div class="custom-select-wrapper">
          <div class="custom-select-trigger liquid-glass liquid-pill" onclick="toggleCustomDropdown('vesselDropdown')">
            <span id="vesselSelectLabel">All Vessels</span>
          </div>
          <div class="custom-dropdown-menu" id="vesselDropdown">
            <div class="search-input-wrapper">
              <input type="text" id="vesselSearch" placeholder="Search Vessel..." oninput="filterCustomOptions('vessel')">
              <button class="clear-search-btn" id="vesselClearBtn" onclick="clearSearch('vessel')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
              </button>
            </div>
            <div class="custom-options-list" id="vesselOptionsList"></div>
          </div>
        </div>
        <input type="hidden" id="vesselFilter" value="ALL">
      </div>

      <!-- CUSTOM SEARCHABLE PORT DROPDOWN -->
      <div class="filter-group" style="z-index: 90;">
        <label class="filter-label">Ports</label>
        <div class="custom-select-wrapper">
          <div class="custom-select-trigger liquid-glass liquid-pill" onclick="toggleCustomDropdown('podDropdown')">
            <span id="podSelectLabel">All Ports</span>
          </div>
          <div class="custom-dropdown-menu" id="podDropdown">
            <div class="search-input-wrapper">
              <input type="text" id="podSearch" placeholder="Search Port..." oninput="filterCustomOptions('pod')">
              <button class="clear-search-btn" id="podClearBtn" onclick="clearSearch('pod')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
              </button>
            </div>
            <div class="custom-options-list" id="podOptionsList"></div>
          </div>
        </div>
        <input type="hidden" id="podFilter" value="ALL">
      </div>

      <div class="filter-group" style="z-index: 80;">
        <label class="filter-label">Container Type</label>
        <select id="eqpFilter" class="filter-select liquid-glass liquid-pill" onchange="applyGlobalFilters()">
          <option value="ALL">All Container Types</option>
          <option value="20GP">20 General Purpose</option>
          <option value="40HQ">40 High Cube</option>
          <option value="SPL">Special Equipment</option>
        </select>
      </div>
    </div>
  </div>

  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h1>Dashboard</h1>
    </div>
    <button class="refresh-btn" onclick="fetchMasterSheet()" ondblclick="window.location.reload(true)">
      <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </button>
  </header>

  <!-- KPI Cards -->
  <div class="card-row-2">
    <div class="stat-card liquid-glass">
      <div class="label-row"><div class="label">BOOKINGS</div><div id="trendBkgs"></div></div>
      <div class="value bkg-val" id="statCount">--</div>
    </div>
    <div class="stat-card liquid-glass">
      <div class="label-row"><div class="label">CONTAINERS</div><div id="trendCntrs"></div></div>
      <div class="value cntr-val" id="statContainers">--</div>
    </div>
  </div>

  <div class="card-row-3">
    <div class="stat-card small-card liquid-glass">
      <div class="label-row"><div class="label">20GP</div><div id="trend20"></div></div>
      <div class="value gp-val" id="stat20">--</div>
    </div>
    <div class="stat-card small-card liquid-glass">
      <div class="label-row"><div class="label">40HQ</div><div id="trend40"></div></div>
      <div class="value hq-val" id="stat40">--</div>
    </div>
    <div class="stat-card small-card liquid-glass">
      <div class="label-row"><div class="label">SPL EQP</div><div id="trendSpl"></div></div>
      <div class="value spl-val" id="statSpl">--</div>
    </div>
  </div>

  <div class="card-row-2" style="margin-bottom: 24px;">
    <div class="stat-card liquid-glass">
      <div class="label-row"><div class="label">TOTAL TEUs</div><div id="trendTeus"></div></div>
      <div class="value teu-val" id="statVolume">--</div>
    </div>
    <div class="stat-card liquid-glass" style="background: var(--card-highlight);">
      <div class="label-row"><div class="label">EARNING PROFIT</div><div id="trendProfit"></div></div>
      <div class="value margin-val" id="statMargin">--</div>
      <div class="sub-value" id="statYield">--</div>
    </div>
  </div>

  <!-- Trends Chart -->
  <div id="summaryChartContainer" class="chart-container liquid-glass">
    <div class="chart-header">
      <div class="chart-title">Monthly Trends</div>
      <select id="chartMetricSelect" class="filter-select liquid-glass liquid-pill mini-select" onchange="renderLineChart()">
        <option value="teus">Teus</option>
        <option value="profit">Profit</option>
        <option value="cntrs">Containers</option>
        <option value="bookings">Bookings</option>
        <option value="gp20">20GP</option>
        <option value="hq40">40HQ</option>
        <option value="spl">Spl Eqp</option>
      </select>
    </div>
    <canvas id="lineChart"></canvas>
  </div>

  <!-- Bottom Table Controls -->
  <div class="controls-bar">
    <div class="controls-top-row">
      <select class="filter-select liquid-glass liquid-pill" id="groupBySelect" onchange="renderTableData()">
        <option value="party">Customer</option>
        <option value="pod">Port</option>
        <option value="vsl">Vessel</option>
        <option value="custType">Customer Type</option>
      </select>
      <div class="switch-track">
        <button class="switch-btn active" id="sort-teu" onclick="setSortBy('teu')">TEUs</button>
        <button class="switch-btn" id="sort-profit" onclick="setSortBy('profit')">Profit</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="customer-table-wrap liquid-glass">
    <table class="cust-table">
      <thead>
        <tr>
          <th id="colHeaderName">Customer Name</th>
          <th>Bkgs</th>
          <th>Cntrs</th>
          <th>TEUs</th>
          <th>Profit</th>
        </tr>
      </thead>
      <tbody id="customerTableBody"></tbody>
    </table>
  </div>

  <script>
    // =========================================================================
    // PASTE YOUR EXISTING GOOGLE APPS SCRIPT WEB APP URL HERE:
    // =========================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpx5kemA_-QV09b_op1YZSkKJtpLG_VSvCxwXf8Is-n2czAdMyxYkXaiYfVC_T2fh9Jw/exec";

    const MONTH_ORDER = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    let dataByMonth = {};
    let activeMonth = "ALL";
    let activeVessel = "ALL";
    let activePod = "ALL";
    let activeEqp = "ALL";
    let sortBy = "teu"; 
    let lineChartInstance = null;

    // Sidebar & Custom Search Dropdown Logic
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      sidebar.classList.toggle("active");
      overlay.classList.toggle("active");
      
      if(!sidebar.classList.contains("active")) {
        document.querySelectorAll(".custom-dropdown-menu").forEach(menu => menu.classList.remove("active"));
      }
    }

    function toggleCustomDropdown(dropdownId) {
      document.querySelectorAll(".custom-dropdown-menu").forEach(menu => {
        if(menu.id !== dropdownId) menu.classList.remove("active");
      });
      const menu = document.getElementById(dropdownId);
      menu.classList.toggle("active");
      if(menu.classList.contains("active")) {
        menu.querySelector("input").focus();
      }
    }

    function selectCustomOption(type, value, label) {
      document.getElementById(type + "Filter").value = value;
      document.getElementById(type + "SelectLabel").textContent = label;
      document.getElementById(type + "Dropdown").classList.remove("active");
      
      const options = document.getElementById(type + "OptionsList").children;
      for(let opt of options) {
        if(opt.textContent === label) opt.classList.add("selected");
        else opt.classList.remove("selected");
      }
      applyGlobalFilters();
    }

    function filterCustomOptions(type) {
      const inputElement = document.getElementById(type + "Search");
      const input = inputElement.value.toLowerCase();
      const clearBtn = document.getElementById(type + "ClearBtn");
      
      // Show/Hide Clear X button dynamically
      if (input.length > 0) {
        clearBtn.style.display = "flex";
      } else {
        clearBtn.style.display = "none";
      }

      const options = document.getElementById(type + "OptionsList").getElementsByClassName("custom-option");
      for (let i = 0; i < options.length; i++) {
        const text = options[i].textContent.toLowerCase();
        options[i].style.display = text.includes(input) ? "" : "none";
      }
    }

    function clearSearch(type) {
      const inputElement = document.getElementById(type + "Search");
      inputElement.value = "";
      filterCustomOptions(type); // Hide button & reset visual list instantly
      
      // Default it back to ALL dynamically without closing the dropdown UI
      const defaultLabel = type === 'vessel' ? 'All Vessels' : 'All Ports';
      document.getElementById(type + "Filter").value = "ALL";
      document.getElementById(type + "SelectLabel").textContent = defaultLabel;
      
      const options = document.getElementById(type + "OptionsList").children;
      for(let opt of options) {
        if(opt.textContent === defaultLabel) opt.classList.add("selected");
        else opt.classList.remove("selected");
      }
      
      applyGlobalFilters(); // Trigger live dashboard reset
      inputElement.focus(); // Keep user seamlessly in the typing flow
    }

    document.addEventListener("click", function(event) {
      if (!event.target.closest(".custom-select-wrapper")) {
        document.querySelectorAll(".custom-dropdown-menu").forEach(menu => menu.classList.remove("active"));
      }
    });

    function normalizeMonthName(rawName) {
      const clean = String(rawName || "").trim().toUpperCase();
      for (const m of MONTH_ORDER) {
        if (clean.startsWith(m) || clean.includes(m)) return m;
      }
      return clean;
    }

    function parseNum(val, fallback = 0) {
      if (val === undefined || val === null || val === "") return fallback;
      if (typeof val === "number") return isNaN(val) ? fallback : val;
      const cleaned = String(val).replace(/[^0-9.-]+/g, "");
      const parsed = parseFloat(cleaned);
      return isNaN(parsed) ? fallback : parsed;
    }

    async function fetchMasterSheet() {
      const statusEl = document.getElementById("lastUpdated");
      const refreshIcon = document.getElementById("refresh-icon");
      
      statusEl.textContent = "Fetching data...";
      if (refreshIcon) refreshIcon.classList.add("spinning");

      try {
        if (APPS_SCRIPT_URL.includes("PASTE_")) throw new Error("Missing Script URL");

        const liveUrl = APPS_SCRIPT_URL + "?_cb=" + new Date().getTime();
        const resp = await fetch(liveUrl, { redirect: "follow" });
        const text = await resp.text();
        
        let rawJson;
        try {
          rawJson = JSON.parse(text);
        } catch (parseError) {
          if (text.includes("<!DOCTYPE html>")) throw new Error("Script Blocked: Check sharing permissions");
          throw new Error("Invalid format returned by Google");
        }

        if (rawJson.error) throw new Error("Error: " + rawJson.error);

        dataByMonth = {};
        const sheetNames = Object.keys(rawJson);
        if (sheetNames.length === 0) throw new Error("Spreadsheet is empty");

        sheetNames.forEach(sheetName => {
          const rawRows = rawJson[sheetName];
          if (!Array.isArray(rawRows) || rawRows.length < 2) return;

          let headerRowIdx = 0;
          for (let r = 0; r < Math.min(5, rawRows.length); r++) {
            const rowText = rawRows[r].join(" ").toLowerCase();
            if (rowText.includes("booking") || rowText.includes("vsl") || rowText.includes("party")) {
              headerRowIdx = r;
              break;
            }
          }

          const headers = rawRows[headerRowIdx].map(h => String(h).trim().toLowerCase());
          const findCol = (keywords, fallbackIdx) => {
            const idx = headers.findIndex(h => keywords.some(k => h.includes(k)));
            return idx !== -1 ? idx : fallbackIdx;
          };

          const bookIdx     = findCol(["booking", "bkg", "bl", "sr"], 0); 
          const partyIdx    = findCol(["party", "customer", "shipper", "forwarder", "client", "company", "name"], 1); 
          const gp20Idx     = findCol(["20gp", "20'", "20st", "20 dv"], 2); 
          const hq40Idx     = findCol(["40hq", "40hc", "40'", "40 hc"], 3); 
          const splIdx      = findCol(["spl", "special", "45", "flat", "open"], 4); 
          const cntrIdx     = findCol(["cntr", "container", "box", "total units", "units"], 5); 
          const teuIdx      = findCol(["teu", "vol", "qty", "volume"], 6); 
          const podIdx      = findCol(["pod", "port", "dest", "discharge"], 9); 
          const marginIdx   = findCol(["margin", "profit", "earning", "net"], 11); 
          const vslIdx      = findCol(["vsl", "vessel"], 12); 
          const custTypeIdx = findCol(["forwarder", "shipper", "cust type", "type", "customer type"], 15); 

          const normalizedRows = [];
          for (let i = headerRowIdx + 1; i < rawRows.length; i++) {
            const r = rawRows[i];
            const bookingVal = String(r[bookIdx] || "").trim();
            const partyVal = String(r[partyIdx] || "").trim();

            if (partyVal.toLowerCase().includes("total") || bookingVal.toLowerCase().includes("total")) continue;
            if (!bookingVal && !partyVal) continue;

            const gp20 = parseNum(r[gp20Idx], 0);
            const hq40 = parseNum(r[hq40Idx], 0);
            const spl = parseNum(r[splIdx], 0);
            const cntrs = parseNum(r[cntrIdx], 0);
            const teus = parseNum(r[teuIdx], 0);
            const margin = parseNum(r[marginIdx], 0);
            
            const vslName = String(r[vslIdx] || "UNKNOWN").trim().toUpperCase();
            const custTypeStr = custTypeIdx !== -1 ? String(r[custTypeIdx] || "UNKNOWN").trim().toUpperCase() : "UNKNOWN";
            
            let deducedEqp = "MIXED";
            if (gp20 > 0 && hq40 === 0 && spl === 0) deducedEqp = "20GP";
            else if (hq40 > 0 && gp20 === 0 && spl === 0) deducedEqp = "40HQ";
            else if (spl > 0 && gp20 === 0 && hq40 === 0) deducedEqp = "SPL";

            normalizedRows.push({
              vsl: vslName,
              party: partyVal.toUpperCase(),
              gp20: gp20,
              hq40: hq40,
              spl: spl,
              cntrs: cntrs,
              teus: teus,
              pod: String(r[podIdx] || "UNKNOWN").trim().toUpperCase(),
              custType: custTypeStr,
              eqpType: deducedEqp,
              margin: margin
            });
          }

          if (normalizedRows.length > 0) {
            const mKey = normalizeMonthName(sheetName);
            if (!dataByMonth[mKey]) dataByMonth[mKey] = [];
            dataByMonth[mKey] = dataByMonth[mKey].concat(normalizedRows);
          }
        });

        populateFilterDropdowns();
        applyGlobalFilters();

        const now = new Date();
        statusEl.textContent = `Updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message || "Error fetching data";
      } finally {
        if (refreshIcon) refreshIcon.classList.remove("spinning");
      }
    }

    function populateFilterDropdowns() {
      const allRows = getFilteredRows("ALL", "ALL", "ALL", "ALL", true);
      
      const vsls = [...new Set(allRows.map(r => r.vsl))].filter(v => v && v !== "UNKNOWN").sort();
      const pods = [...new Set(allRows.map(r => r.pod))].filter(p => p && p !== "UNKNOWN").sort();

      const months = Object.keys(dataByMonth).sort((a, b) => {
        const idxA = MONTH_ORDER.indexOf(a);
        const idxB = MONTH_ORDER.indexOf(b);
        return (idxA !== -1 && idxB !== -1) ? idxA - idxB : a.localeCompare(b);
      });

      // Month
      const monthSel = document.getElementById("mainMonthSelect");
      monthSel.innerHTML = `<option value="ALL">All Months Overview</option>` + months.map(m => `<option value="${m}">${m}</option>`).join("");
      monthSel.value = months.includes(activeMonth) ? activeMonth : "ALL";

      // Custom Searchable Vessel List
      const vslList = document.getElementById("vesselOptionsList");
      let vslHtml = `<div class="custom-option ${activeVessel === 'ALL' ? 'selected' : ''}" onclick="selectCustomOption('vessel', 'ALL', 'All Vessels')">All Vessels</div>`;
      vsls.forEach(v => {
        const safeV = v.replace(/'/g, "\\'");
        vslHtml += `<div class="custom-option ${activeVessel === v ? 'selected' : ''}" onclick="selectCustomOption('vessel', '${safeV}', '${safeV}')">${v}</div>`;
      });
      vslList.innerHTML = vslHtml;
      document.getElementById("vesselFilter").value = vsls.includes(activeVessel) ? activeVessel : "ALL";
      document.getElementById("vesselSelectLabel").textContent = (activeVessel === "ALL" || !vsls.includes(activeVessel)) ? "All Vessels" : activeVessel;

      // Custom Searchable Port List
      const podList = document.getElementById("podOptionsList");
      let podHtml = `<div class="custom-option ${activePod === 'ALL' ? 'selected' : ''}" onclick="selectCustomOption('pod', 'ALL', 'All Ports')">All Ports</div>`;
      pods.forEach(p => {
        const safeP = p.replace(/'/g, "\\'");
        podHtml += `<div class="custom-option ${activePod === p ? 'selected' : ''}" onclick="selectCustomOption('pod', '${safeP}', '${safeP}')">${p}</div>`;
      });
      podList.innerHTML = podHtml;
      document.getElementById("podFilter").value = pods.includes(activePod) ? activePod : "ALL";
      document.getElementById("podSelectLabel").textContent = (activePod === "ALL" || !pods.includes(activePod)) ? "All Ports" : activePod;
    }

    function getFilteredRows(month, vsl, pod, eqp, bypassEqp = false) {
      let rows = [];
      if (month === "ALL") {
        Object.values(dataByMonth).forEach(mRows => rows = rows.concat(mRows));
      } else {
        rows = dataByMonth[month] || [];
      }
      
      if (vsl !== "ALL") rows = rows.filter(r => r.vsl === vsl);
      if (pod !== "ALL") rows = rows.filter(r => r.pod === pod);
      
      if (!bypassEqp && eqp !== "ALL") {
        if (eqp === "20GP") rows = rows.filter(r => r.gp20 > 0);
        if (eqp === "40HQ") rows = rows.filter(r => r.hq40 > 0);
        if (eqp === "SPL") rows = rows.filter(r => r.spl > 0);
      }
      
      return rows;
    }

    function applyGlobalFilters() {
      activeMonth = document.getElementById("mainMonthSelect").value;
      activeVessel = document.getElementById("vesselFilter").value; 
      activePod = document.getElementById("podFilter").value;       
      activeEqp = document.getElementById("eqpFilter").value;

      updateKPIsAndTrends();
      renderTableData();
      
      const chartContainer = document.getElementById("summaryChartContainer");
      if (activeMonth === "ALL") {
        chartContainer.style.display = "block";
        renderLineChart();
      } else {
        chartContainer.style.display = "none";
      }
    }

    function getTrendHTML(cur, prev, show) {
      if (!show) return "";
      if (prev === 0 && cur === 0) return `<span class="trend-badge neutral">0%</span>`;
      if (prev === 0) return `<span class="trend-badge up">▲ 100%</span>`;
      const pct = Math.round(((cur - prev) / prev) * 100);
      if (pct > 0) return `<span class="trend-badge up">▲ ${pct}%</span>`;
      if (pct < 0) return `<span class="trend-badge down">▼ ${Math.abs(pct)}%</span>`;
      return `<span class="trend-badge neutral">0%</span>`;
    }

    function updateKPIsAndTrends() {
      const currentRows = getFilteredRows(activeMonth, activeVessel, activePod, activeEqp);
      
      let curBkgs = currentRows.length;
      let curCntrs = 0, curTeus = 0, curMargin = 0, cur20 = 0, cur40 = 0, curSpl = 0;
      
      currentRows.forEach(r => { 
        curCntrs += r.cntrs; curTeus += r.teus; curMargin += r.margin;
        cur20 += r.gp20; cur40 += r.hq40; curSpl += r.spl;
      });

      let prevBkgs = 0, prevCntrs = 0, prevTeus = 0, prevMargin = 0, prev20 = 0, prev40 = 0, prevSpl = 0;
      let showTrend = false;

      if (activeMonth !== "ALL") {
        const availableMonths = MONTH_ORDER.filter(m => dataByMonth[m]);
        const currIdx = availableMonths.indexOf(activeMonth);
        if (currIdx > 0) {
          const prevMonth = availableMonths[currIdx - 1];
          const prevRows = getFilteredRows(prevMonth, activeVessel, activePod, activeEqp);
          prevBkgs = prevRows.length;
          prevRows.forEach(r => { 
            prevCntrs += r.cntrs; prevTeus += r.teus; prevMargin += r.margin;
            prev20 += r.gp20; prev40 += r.hq40; prevSpl += r.spl;
          });
          showTrend = true;
        }
      }

      document.getElementById("statCount").textContent = curBkgs.toLocaleString();
      document.getElementById("statContainers").textContent = Math.round(curCntrs).toLocaleString();
      document.getElementById("stat20").textContent = Math.round(cur20).toLocaleString();
      document.getElementById("stat40").textContent = Math.round(cur40).toLocaleString();
      document.getElementById("statSpl").textContent = Math.round(curSpl).toLocaleString();
      document.getElementById("statVolume").textContent = Math.round(curTeus).toLocaleString();
      document.getElementById("statMargin").textContent = "$" + Math.round(curMargin).toLocaleString();

      document.getElementById("trendBkgs").innerHTML = getTrendHTML(curBkgs, prevBkgs, showTrend);
      document.getElementById("trendCntrs").innerHTML = getTrendHTML(curCntrs, prevCntrs, showTrend);
      document.getElementById("trend20").innerHTML = getTrendHTML(cur20, prev20, showTrend);
      document.getElementById("trend40").innerHTML = getTrendHTML(cur40, prev40, showTrend);
      document.getElementById("trendSpl").innerHTML = getTrendHTML(curSpl, prevSpl, showTrend);
      document.getElementById("trendTeus").innerHTML = getTrendHTML(curTeus, prevTeus, showTrend);
      document.getElementById("trendProfit").innerHTML = getTrendHTML(curMargin, prevMargin, showTrend);

      const yieldPerCntr = curCntrs > 0 ? Math.round(curMargin / curCntrs) : 0;
      document.getElementById("statYield").textContent = `YIELD: $${yieldPerCntr.toLocaleString()} / CNTR`;
    }

    function setSortBy(s) {
      sortBy = s;
      document.getElementById("sort-teu").classList.toggle("active", s === "teu");
      document.getElementById("sort-profit").classList.toggle("active", s === "profit");
      renderTableData();
    }

    function renderTableData() {
      const groupBy = document.getElementById("groupBySelect").value;
      const headerNameEl = document.getElementById("colHeaderName");

      if (groupBy === "party") headerNameEl.textContent = "Customer Name";
      else if (groupBy === "pod") headerNameEl.textContent = "Port";
      else if (groupBy === "vsl") headerNameEl.textContent = "Vessel";
      else if (groupBy === "custType") headerNameEl.textContent = "Customer Type";

      const rows = getFilteredRows(activeMonth, activeVessel, activePod, activeEqp);
      const aggregatedMap = {};

      rows.forEach(item => {
        let groupKey = item.party;
        if (groupBy === "pod") groupKey = item.pod;
        if (groupBy === "vsl") groupKey = item.vsl;
        if (groupBy === "custType") groupKey = item.custType;

        if (!aggregatedMap[groupKey]) {
          aggregatedMap[groupKey] = { name: groupKey, bookings: 0, cntrs: 0, teus: 0, profit: 0 };
        }
        aggregatedMap[groupKey].bookings += 1;
        aggregatedMap[groupKey].cntrs += item.cntrs;
        aggregatedMap[groupKey].teus += item.teus;
        aggregatedMap[groupKey].profit += item.margin;
      });

      const sortedArray = Object.values(aggregatedMap).sort((a, b) => {
        return sortBy === "profit" ? (b.profit - a.profit) : (b.teus - a.teus);
      });

      const tableHtml = sortedArray.map(c => {
        const yieldVal = c.cntrs > 0 ? Math.round(c.profit / c.cntrs) : 0;
        return `
        <tr>
          <td>${c.name}</td>
          <td style="color: var(--accent-blue);">${c.bookings}</td>
          <td style="color: var(--text-light);">${Math.round(c.cntrs)}</td>
          <td style="color: var(--purple);">${Math.round(c.teus)}</td>
          <td>
            <span class="cell-main" style="color: var(--accent);">$${Math.round(c.profit).toLocaleString()}</span>
            <span class="cell-sub">$${yieldVal.toLocaleString()}/c</span>
          </td>
        </tr>`;
      }).join("");

      document.getElementById("customerTableBody").innerHTML = tableHtml || `<tr><td colspan="5" style="text-align:center; color: var(--subtext-light); padding: 30px;">No data available for this filter combination</td></tr>`;
    }

    function renderLineChart() {
      if (activeMonth !== "ALL") return;

      const metric = document.getElementById("chartMetricSelect").value;
      const labels = [];
      const dataPoints = [];
      const availableMonths = MONTH_ORDER.filter(m => dataByMonth[m]);

      availableMonths.forEach(m => {
        labels.push(m);
        let sum = 0;
        const mRows = getFilteredRows(m, activeVessel, activePod, activeEqp);
        mRows.forEach(row => {
          if (metric === 'teus') sum += row.teus;
          else if (metric === 'profit') sum += row.margin;
          else if (metric === 'cntrs') sum += row.cntrs;
          else if (metric === 'bookings') sum += 1;
          else if (metric === 'gp20') sum += row.gp20;
          else if (metric === 'hq40') sum += row.hq40;
          else if (metric === 'spl') sum += row.spl;
        });
        dataPoints.push(Math.round(sum));
      });

      const ctx = document.getElementById("lineChart").getContext("2d");
      if (lineChartInstance) lineChartInstance.destroy();

      let color = "#5eead4"; 
      if (metric === 'profit') color = "#4ade80"; 
      else if (metric === 'teus') color = "#c084fc"; 
      else if (metric === 'cntrs') color = "#60a5fa"; 
      else if (metric === 'gp20') color = "#60a5fa"; 
      else if (metric === 'hq40') color = "#fb923c"; 
      else if (metric === 'spl') color = "#fb7185";  

      lineChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: metric.toUpperCase(),
            data: dataPoints,
            borderColor: color,
            backgroundColor: color + '28', 
            borderWidth: 2.5,
            pointBackgroundColor: color,
            pointRadius: 4.5,
            pointBorderColor: '#ffffff',
            pointBorderWidth: 1.5,
            fill: true,
            tension: 0.4 
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { 
              grid: { color: 'rgba(255,255,255,0.06)', drawBorder: false }, 
              ticks: { color: 'rgba(255,255,255,0.6)', font: { size: 10, family: 'system-ui, -apple-system' } }, 
              beginAtZero: true 
            },
            x: { 
              grid: { display: false }, 
              ticks: { color: 'rgba(255,255,255,0.6)', font: { size: 10, family: 'system-ui, -apple-system' } } 
            }
          }
        }
      });
    }

    document.getElementById("summaryChartContainer").style.display = "block";
    setInterval(fetchMasterSheet, 5 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchMasterSheet(); });
    window.addEventListener("DOMContentLoaded", fetchMasterSheet);
  </script>
</body>
