<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Tracker</title>

  <!-- Prevent iOS Caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS PWA Fullscreen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Live Tracker" />

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #162032;
      --card-alt: #1e293b;
      --accent: #38bdf8;
      --purple: #818cf8;
      --green: #34d399;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #243248;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .status {
      font-size: 0.72rem;
      color: var(--subtext);
      margin-top: 2px;
    }
    button.refresh-btn {
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.refresh-btn:active { opacity: 0.6; }

    /* Horizontal Month Pill Tabs */
    .month-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .month-tabs::-webkit-scrollbar { display: none; }
    .month-tab {
      flex: 0 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 9px 18px;
      border-radius: 22px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .month-tab.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Top 3 KPI Summary Cards */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid var(--border);
    }
    .stat-card .label {
      font-size: 0.62rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }
    .stat-card .value {
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 5px;
      color: var(--accent);
    }
    .stat-card .value.teu-val { color: var(--purple); }
    .stat-card .value.margin-val { color: var(--green); }

    /* Controls Bar (Filter Dropdown + Sort Pills) */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    select.filter-select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      flex: 1;
    }
    .mini-pills {
      display: flex;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .mini-pill {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 6px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .mini-pill.active {
      background: var(--card-alt);
      color: var(--accent);
    }

    /* Full Table View Container */
    .customer-table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    table.cust-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    table.cust-table th {
      background: #0f172a;
      color: var(--subtext);
      font-size: 0.68rem;
      text-transform: uppercase;
      padding: 12px 10px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.3px;
    }
    table.cust-table th:first-child { text-align: left; }
    table.cust-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #1e293b;
      text-align: right;
      font-weight: 600;
    }
    table.cust-table td:first-child {
      text-align: left;
      font-weight: 700;
      color: var(--text);
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Live Tracker</h1>
      <div class="status" id="lastUpdated">Updating...</div>
    </div>
    <!-- Single tap refreshes data; Double tap forces app reload -->
    <button class="refresh-btn" onclick="fetchMasterSheet()" ondblclick="window.location.reload(true)">↻ Refresh</button>
  </header>

  <!-- Month Pill Bar -->
  <div class="month-tabs" id="monthTabs">
    <button class="month-tab active" onclick="selectMonth('ALL')">ALL</button>
  </div>

  <!-- Top KPI Cards -->
  <div class="card-grid">
    <div class="stat-card">
      <div class="label">BOOKINGS</div>
      <div class="value" id="statCount">--</div>
    </div>
    <div class="stat-card">
      <div class="label">TOTAL TEUs</div>
      <div class="value teu-val" id="statVolume">--</div>
    </div>
    <div class="stat-card">
      <div class="label">EARNING PROFIT</div>
      <div class="value margin-val" id="statMargin">--</div>
    </div>
  </div>

  <!-- Filter & Sort Bar -->
  <div class="controls-bar">
    <select class="filter-select" id="groupBySelect" onchange="renderTableData()">
      <option value="party">Group By: Customer Name</option>
      <option value="pod">Group By: POD (Port)</option>
      <option value="vsl">Group By: Vessel</option>
    </select>
    <div class="mini-pills">
      <button class="mini-pill active" id="sort-teu" onclick="setSortBy('teu')">TEUs</button>
      <button class="mini-pill" id="sort-profit" onclick="setSortBy('profit')">Profit</button>
    </div>
  </div>

  <!-- Master Table View Only -->
  <div class="customer-table-wrap">
    <table class="cust-table">
      <thead>
        <tr>
          <th id="colHeaderName">Customer Name</th>
          <th>Bkgs</th>
          <th>TEUs</th>
          <th>Profit</th>
        </tr>
      </thead>
      <tbody id="customerTableBody"></tbody>
    </table>
  </div>

  <script>
    // =========================================================================
    // PASTE YOUR SINGLE MASTER GOOGLE SHEET PUBLISHED LINK HERE:
    // =========================================================================
    const MASTER_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRszublKGPZpDKbqmiC2DMOOtQBngZCYGhQ02HSQXkd49PZNRKnywOl-PvHY7teCz8gP8l3iAywhPY7/pub?output=xlsx";

    const MONTH_ORDER = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    let dataByMonth = {};
    let activeMonth = "ALL";
    let sortBy = "teu"; // 'teu' or 'profit'

    function toMultiTabUrl(rawUrl) {
      if (!rawUrl || rawUrl.includes("PASTE_")) return "";
      const base = rawUrl.split("?")[0];
      return `${base}?output=xlsx&_cb=${Date.now()}`;
    }

    function normalizeMonthName(rawName) {
      const clean = String(rawName || "").trim().toUpperCase();
      for (const m of MONTH_ORDER) {
        if (clean.startsWith(m) || clean.includes(m)) return m;
      }
      return clean;
    }

    function parseNum(val, fallback = 0) {
      if (typeof val === "number") return isNaN(val) ? fallback : val;
      if (!val) return fallback;
      const cleaned = String(val).replace(/[^0-9.-]+/g, "");
      const parsed = parseFloat(cleaned);
      return isNaN(parsed) ? fallback : parsed;
    }

    async function fetchMasterSheet() {
      const statusEl = document.getElementById("lastUpdated");
      statusEl.textContent = "Refreshing...";

      try {
        const liveUrl = toMultiTabUrl(MASTER_SHEET_URL);
        if (!liveUrl) {
          statusEl.textContent = "Paste Master Sheet URL in code";
          return;
        }

        const resp = await fetch(liveUrl);
        const arrayBuffer = await resp.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: "array" });

        dataByMonth = {};

        workbook.SheetNames.forEach(sheetName => {
          const sheet = workbook.Sheets[sheetName];
          const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          if (rawRows.length < 2) return;

          let headerRowIdx = 0;
          for (let r = 0; r < Math.min(5, rawRows.length); r++) {
            const rowText = rawRows[r].join(" ").toLowerCase();
            if (rowText.includes("booking") || rowText.includes("vsl") || rowText.includes("pod") || rowText.includes("margin")) {
              headerRowIdx = r;
              break;
            }
          }

          const headers = rawRows[headerRowIdx].map(h => String(h).trim().toLowerCase());
          const findCol = (keywords, fallbackIdx) => {
            const idx = headers.findIndex(h => keywords.some(k => h.includes(k)));
            return idx !== -1 ? idx : fallbackIdx;
          };

          const bookIdx   = findCol(["booking", "bkg", "bl"], 1);
          const vslIdx    = findCol(["vsl", "vessel"], 2);
          const partyIdx  = findCol(["party", "customer", "shipper", "forwarder", "client", "company", "name"], 4);
          const volIdx    = findCol(["teu", "vol", "qty", "cntr", "container", "box", "count"], 6);
          const podIdx    = findCol(["pod", "port", "dest", "discharge"], 8);
          const buyIdx    = findCol(["buy", "cost"], 9);
          const sellIdx   = findCol(["sell", "rate"], 10);
          const marginIdx = findCol(["margin", "profit", "earning", "net"], 11);

          const normalizedRows = [];
          for (let i = headerRowIdx + 1; i < rawRows.length; i++) {
            const r = rawRows[i];
            const bookingVal = String(r[bookIdx] || "").trim();
            const partyVal = String(r[partyIdx] || "").trim();

            if (!bookingVal && !partyVal) continue;
            if (partyVal.toLowerCase().includes("total") || bookingVal.toLowerCase().includes("total")) continue;

            const vol = parseNum(r[volIdx], 1);
            let margin = parseNum(r[marginIdx], NaN);
            if (isNaN(margin)) {
              const buy = parseNum(r[buyIdx], NaN);
              const sell = parseNum(r[sellIdx], NaN);
              margin = (!isNaN(buy) && !isNaN(sell)) ? (sell - buy) * vol : 0;
            }

            normalizedRows.push({
              vsl: String(r[vslIdx] || "UNKNOWN").trim().toUpperCase(),
              party: (partyVal || "UNKNOWN").toUpperCase(),
              vol: vol,
              pod: String(r[podIdx] || "UNKNOWN").trim().toUpperCase(),
              margin: margin
            });
          }

          if (normalizedRows.length > 0) {
            const mKey = normalizeMonthName(sheetName);
            if (!dataByMonth[mKey]) dataByMonth[mKey] = [];
            dataByMonth[mKey] = dataByMonth[mKey].concat(normalizedRows);
          }
        });

        renderMonthTabs();
        renderTableData();

        const now = new Date();
        statusEl.textContent = `Updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error loading master sheet";
      }
    }

    function renderMonthTabs() {
      const container = document.getElementById("monthTabs");
      const months = Object.keys(dataByMonth).sort((a, b) => {
        const idxA = MONTH_ORDER.indexOf(a);
        const idxB = MONTH_ORDER.indexOf(b);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        return a.localeCompare(b);
      });

      if (activeMonth !== "ALL" && !months.includes(activeMonth)) {
        activeMonth = "ALL";
      }

      let html = `<button class="month-tab ${activeMonth === 'ALL' ? 'active' : ''}" onclick="selectMonth('ALL')">ALL</button>`;
      months.forEach(m => {
        const isActive = activeMonth === m ? "active" : "";
        html += `<button class="month-tab ${isActive}" onclick="selectMonth('${m}')">${m}</button>`;
      });
      container.innerHTML = html;
    }

    function selectMonth(m) {
      activeMonth = m;
      renderMonthTabs();
      renderTableData();
    }

    function setSortBy(s) {
      sortBy = s;
      ["teu", "profit"].forEach(k => {
        document.getElementById(`sort-${k}`).classList.toggle("active", k === s);
      });
      renderTableData();
    }

    function renderTableData() {
      const groupBy = document.getElementById("groupBySelect").value;
      const headerNameEl = document.getElementById("colHeaderName");

      if (groupBy === "party") headerNameEl.textContent = "Customer Name";
      else if (groupBy === "pod") headerNameEl.textContent = "POD (Port)";
      else headerNameEl.textContent = "Vessel Name";

      let rows = [];
      if (activeMonth === "ALL") {
        Object.values(dataByMonth).forEach(mRows => { rows = rows.concat(mRows); });
      } else {
        rows = dataByMonth[activeMonth] || [];
      }

      let totalBookings = rows.length;
      let totalTEUs = 0;
      let totalProfit = 0;
      const aggregatedMap = {};

      rows.forEach(item => {
        totalTEUs += item.vol;
        totalProfit += item.margin;

        let groupKey = item.party;
        if (groupBy === "pod") groupKey = item.pod;
        if (groupBy === "vsl") groupKey = item.vsl;

        if (!aggregatedMap[groupKey]) {
          aggregatedMap[groupKey] = { name: groupKey, bookings: 0, teus: 0, profit: 0 };
        }
        aggregatedMap[groupKey].bookings += 1;
        aggregatedMap[groupKey].teus += item.vol;
        aggregatedMap[groupKey].profit += item.margin;
      });

      // Update KPI Top Cards
      document.getElementById("statCount").textContent = totalBookings.toLocaleString();
      document.getElementById("statVolume").textContent = Math.round(totalTEUs).toLocaleString();
      document.getElementById("statMargin").textContent = "$" + Math.round(totalProfit).toLocaleString();

      // Sort Table Rows
      const sortedArray = Object.values(aggregatedMap).sort((a, b) => {
        return sortBy === "profit" ? (b.profit - a.profit) : (b.teus - a.teus);
      });

      const tableHtml = sortedArray.map(c => `
        <tr>
          <td>${c.name}</td>
          <td style="color: var(--accent);">${c.bookings}</td>
          <td style="color: var(--purple);">${Math.round(c.teus)}</td>
          <td style="color: var(--green);">$${Math.round(c.profit).toLocaleString()}</td>
        </tr>
      `).join("");

      document.getElementById("customerTableBody").innerHTML = tableHtml || `<tr><td colspan="4" style="text-align:center; color: var(--subtext);">No data available</td></tr>`;
    }

    setInterval(fetchMasterSheet, 5 * 60 * 1000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchMasterSheet();
    });
    window.addEventListener("DOMContentLoaded", fetchMasterSheet);
  </script>
</body>
</html>
