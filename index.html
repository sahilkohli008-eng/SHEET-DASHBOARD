<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dashboard" />

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      /* Native iOS Dark Mode Palette */
      --bg: #000000;
      --card-bg: #1c1c1e;
      --card-alt: #2c2c2e;
      --accent: #0a84ff;   /* iOS System Blue */
      --purple: #bf5af2;   /* iOS System Purple */
      --green: #30d158;    /* iOS System Green */
      --orange: #ff9f0a;   /* iOS System Orange */
      --red: #ff453a;      /* iOS System Red */
      --text: #ffffff;
      --subtext: #8e8e93;  /* iOS System Gray */
      --border: #38383a;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-top: 4px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .status {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-top: 2px;
    }
    
    button.refresh-btn {
      background: var(--card-alt);
      color: var(--accent);
      width: 36px;
      height: 36px;
      border-radius: 18px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.refresh-btn:active { opacity: 0.5; }
    button.refresh-btn svg { width: 18px; height: 18px; }

    /* Global Filters */
    .global-filters {
      margin-bottom: 16px;
    }
    select.filter-select {
      background: var(--card-bg);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
    }
    select#mainMonthSelect {
      width: 100%;
      background-color: var(--card-alt);
      font-size: 1rem;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .sub-filters {
      display: flex;
      gap: 10px;
    }
    .sub-filters select {
      flex: 1;
    }

    /* KPI Cards with Trend Badges */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .stat-card .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-card .label {
      font-size: 0.65rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .trend-badge {
      font-size: 0.65rem;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
    }
    .trend-badge.up { background: rgba(48, 209, 88, 0.15); color: var(--green); }
    .trend-badge.down { background: rgba(255, 69, 58, 0.15); color: var(--red); }
    .trend-badge.neutral { background: var(--card-alt); color: var(--subtext); }

    .stat-card .value {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 6px;
      color: var(--accent);
      letter-spacing: -0.2px;
    }
    .stat-card .value.cntr-val { color: var(--text); }
    .stat-card .value.teu-val { color: var(--purple); }
    .stat-card .value.margin-val { color: var(--green); }
    .sub-value {
      font-size: 0.7rem;
      color: var(--subtext);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Line Chart Summary */
    .chart-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: none;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .chart-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    select.mini-select {
      background: var(--card-alt);
      padding: 6px 30px 6px 10px;
      font-size: 0.75rem;
      border-radius: 8px;
      background-size: 12px;
    }
    canvas {
      width: 100%;
      max-height: 220px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .controls-bar select { flex: 1; }
    .mini-pills {
      display: flex;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 3px;
    }
    .mini-pill {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .mini-pill.active { background: #48484a; }

    /* Master Table */
    .customer-table-wrap {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      padding-bottom: 8px;
    }
    table.cust-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    table.cust-table th {
      color: var(--subtext);
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 14px 10px 10px 10px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.4px;
      font-weight: 600;
    }
    table.cust-table th:first-child { text-align: left; padding-left: 16px; }
    table.cust-table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      font-weight: 600;
      vertical-align: middle;
    }
    table.cust-table tr:last-child td { border-bottom: none; }
    table.cust-table td:first-child {
      text-align: left;
      padding-left: 16px;
      font-weight: 600;
      color: var(--text);
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell-main { display: block; }
    .cell-sub { font-size: 0.65rem; color: var(--subtext); margin-top: 3px; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Dashboard</h1>
      <div class="status" id="lastUpdated">Updating...</div>
    </div>
    <button class="refresh-btn" onclick="fetchMasterSheet()" ondblclick="window.location.reload(true)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </button>
  </header>

  <div class="global-filters">
    <select id="mainMonthSelect" class="filter-select" onchange="applyGlobalFilters()">
      <option value="ALL">All Months Overview</option>
    </select>
    <div class="sub-filters">
      <select id="serviceFilter" class="filter-select" onchange="applyGlobalFilters()">
        <option value="ALL">All Services</option>
      </select>
      <select id="podFilter" class="filter-select" onchange="applyGlobalFilters()">
        <option value="ALL">All Ports</option>
      </select>
    </div>
  </div>

  <div class="card-grid">
    <div class="stat-card">
      <div class="label-row">
        <div class="label">BOOKINGS</div>
        <div id="trendBkgs"></div>
      </div>
      <div class="value" id="statCount">--</div>
    </div>
    <div class="stat-card">
      <div class="label-row">
        <div class="label">CONTAINERS</div>
        <div id="trendCntrs"></div>
      </div>
      <div class="value cntr-val" id="statContainers">--</div>
    </div>
    <div class="stat-card">
      <div class="label-row">
        <div class="label">TOTAL TEUs</div>
        <div id="trendTeus"></div>
      </div>
      <div class="value teu-val" id="statVolume">--</div>
    </div>
    <div class="stat-card">
      <div class="label-row">
        <div class="label">EARNING PROFIT</div>
        <div id="trendProfit"></div>
      </div>
      <div class="value margin-val" id="statMargin">--</div>
      <div class="sub-value" id="statYield">--</div>
    </div>
  </div>

  <div id="summaryChartContainer" class="chart-container">
    <div class="chart-header">
      <div class="chart-title">Monthly Trends</div>
      <select id="chartMetricSelect" class="filter-select mini-select" onchange="renderLineChart()">
        <option value="teus">TEUs</option>
        <option value="profit">Profit</option>
        <option value="cntrs">Containers</option>
        <option value="bookings">Bookings</option>
      </select>
    </div>
    <canvas id="lineChart"></canvas>
  </div>

  <div class="controls-bar">
    <select class="filter-select" id="groupBySelect" onchange="renderTableData()">
      <option value="party">Group By: Customer</option>
      <option value="pod">Group By: POD (Port)</option>
      <option value="vsl">Group By: Vessel</option>
      <option value="srv">Group By: Service</option>
      <option value="type">Group By: Cntr Type</option>
    </select>
    <div class="mini-pills">
      <button class="mini-pill active" id="sort-teu" onclick="setSortBy('teu')">TEUs</button>
      <button class="mini-pill" id="sort-profit" onclick="setSortBy('profit')">Profit</button>
    </div>
  </div>

  <div class="customer-table-wrap">
    <table class="cust-table">
      <thead>
        <tr>
          <th id="colHeaderName">Customer Name</th>
          <th>Bkgs</th>
          <th>Cntrs</th>
          <th>TEUs</th>
          <th>Profit</th>
        </tr>
      </thead>
      <tbody id="customerTableBody"></tbody>
    </table>
  </div>

  <script>
    // =========================================================================
    // PASTE YOUR EXISTING GOOGLE APPS SCRIPT WEB APP URL HERE:
    // =========================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpx5kemA_-QV09b_op1YZSkKJtpLG_VSvCxwXf8Is-n2czAdMyxYkXaiYfVC_T2fh9Jw/exec";

    const MONTH_ORDER = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    let dataByMonth = {};
    let activeMonth = "ALL";
    let activeService = "ALL";
    let activePod = "ALL";
    let sortBy = "teu"; 
    let lineChartInstance = null;

    function normalizeMonthName(rawName) {
      const clean = String(rawName || "").trim().toUpperCase();
      for (const m of MONTH_ORDER) {
        if (clean.startsWith(m) || clean.includes(m)) return m;
      }
      return clean;
    }

    function parseNum(val, fallback = 0) {
      if (val === undefined || val === null || val === "") return fallback;
      if (typeof val === "number") return isNaN(val) ? fallback : val;
      const cleaned = String(val).replace(/[^0-9.-]+/g, "");
      const parsed = parseFloat(cleaned);
      return isNaN(parsed) ? fallback : parsed;
    }

    async function fetchMasterSheet() {
      const statusEl = document.getElementById("lastUpdated");
      statusEl.textContent = "Fetching data...";

      try {
        if (APPS_SCRIPT_URL.includes("PASTE_")) throw new Error("Missing Script URL");

        const liveUrl = APPS_SCRIPT_URL + "?_cb=" + new Date().getTime();
        const resp = await fetch(liveUrl, { redirect: "follow" });
        const text = await resp.text();
        
        let rawJson;
        try {
          rawJson = JSON.parse(text);
        } catch (parseError) {
          if (text.includes("<!DOCTYPE html>")) throw new Error("Script Blocked: Check sharing permissions");
          throw new Error("Invalid format returned by Google");
        }

        if (rawJson.error) throw new Error("Error: " + rawJson.error);

        dataByMonth = {};
        const sheetNames = Object.keys(rawJson);
        if (sheetNames.length === 0) throw new Error("Spreadsheet is empty");

        sheetNames.forEach(sheetName => {
          const rawRows = rawJson[sheetName];
          if (!Array.isArray(rawRows) || rawRows.length < 2) return;

          let headerRowIdx = 0;
          for (let r = 0; r < Math.min(5, rawRows.length); r++) {
            const rowText = rawRows[r].join(" ").toLowerCase();
            if (rowText.includes("booking") || rowText.includes("vsl") || rowText.includes("party")) {
              headerRowIdx = r;
              break;
            }
          }

          const headers = rawRows[headerRowIdx].map(h => String(h).trim().toLowerCase());
          const findCol = (keywords, fallbackIdx) => {
            const idx = headers.findIndex(h => keywords.some(k => h.includes(k)));
            return idx !== -1 ? idx : fallbackIdx;
          };

          const bookIdx   = findCol(["booking", "bkg", "bl", "sr"], 0);
          const partyIdx  = findCol(["party", "customer", "shipper", "forwarder", "client", "company", "name"], 1);
          const cntrIdx   = findCol(["cntr", "container", "box", "total units", "units"], 5);
          const teuIdx    = findCol(["teu", "vol", "qty", "volume"], 6);
          const podIdx    = findCol(["pod", "port", "dest", "discharge"], 9);
          const vslIdx    = findCol(["vsl", "vessel"], 12);
          
          // New Columns for Service & Container Type
          const srvIdx    = findCol(["service", "srv", "loop", "line"], -1);
          const typeIdx   = findCol(["type", "size", "eqp", "equipment"], -1);
          
          const marginIdx = findCol(["margin", "profit", "earning", "net"], 11);

          const normalizedRows = [];
          for (let i = headerRowIdx + 1; i < rawRows.length; i++) {
            const r = rawRows[i];
            const bookingVal = String(r[bookIdx] || "").trim();
            const partyVal = String(r[partyIdx] || "").trim();

            if (partyVal.toLowerCase().includes("total") || bookingVal.toLowerCase().includes("total")) continue;
            if (!bookingVal && !partyVal) continue;

            const cntrs = parseNum(r[cntrIdx], 0);
            const teus = parseNum(r[teuIdx], 0);
            const margin = parseNum(r[marginIdx], 0);

            const srv = srvIdx !== -1 ? String(r[srvIdx] || "UNKNOWN").trim().toUpperCase() : "UNKNOWN";
            const cType = typeIdx !== -1 ? String(r[typeIdx] || "UNKNOWN").trim().toUpperCase() : "UNKNOWN";

            normalizedRows.push({
              vsl: String(r[vslIdx] || "UNKNOWN").trim().toUpperCase(),
              party: partyVal.toUpperCase(),
              cntrs: cntrs,
              teus: teus,
              pod: String(r[podIdx] || "UNKNOWN").trim().toUpperCase(),
              srv: srv,
              type: cType,
              margin: margin
            });
          }

          if (normalizedRows.length > 0) {
            const mKey = normalizeMonthName(sheetName);
            if (!dataByMonth[mKey]) dataByMonth[mKey] = [];
            dataByMonth[mKey] = dataByMonth[mKey].concat(normalizedRows);
          }
        });

        populateFilterDropdowns();
        applyGlobalFilters();

        const now = new Date();
        statusEl.textContent = `Updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = err.message || "Error fetching data";
      }
    }

    function populateFilterDropdowns() {
      const allRows = getFilteredRows("ALL", "ALL", "ALL");
      const srvs = [...new Set(allRows.map(r => r.srv))].filter(s => s && s !== "UNKNOWN").sort();
      const pods = [...new Set(allRows.map(r => r.pod))].filter(p => p && p !== "UNKNOWN").sort();

      const months = Object.keys(dataByMonth).sort((a, b) => {
        const idxA = MONTH_ORDER.indexOf(a);
        const idxB = MONTH_ORDER.indexOf(b);
        return (idxA !== -1 && idxB !== -1) ? idxA - idxB : a.localeCompare(b);
      });

      // Update Month Dropdown
      const monthSel = document.getElementById("mainMonthSelect");
      monthSel.innerHTML = `<option value="ALL">All Months Overview</option>` + months.map(m => `<option value="${m}">${m}</option>`).join("");
      monthSel.value = months.includes(activeMonth) ? activeMonth : "ALL";

      // Update Service Dropdown
      const srvSel = document.getElementById("serviceFilter");
      srvSel.innerHTML = `<option value="ALL">All Services</option>` + srvs.map(s => `<option value="${s}">${s}</option>`).join("");
      srvSel.value = srvs.includes(activeService) ? activeService : "ALL";

      // Update POD Dropdown
      const podSel = document.getElementById("podFilter");
      podSel.innerHTML = `<option value="ALL">All Ports</option>` + pods.map(p => `<option value="${p}">${p}</option>`).join("");
      podSel.value = pods.includes(activePod) ? activePod : "ALL";
    }

    function getFilteredRows(month, srv, pod) {
      let rows = [];
      if (month === "ALL") {
        Object.values(dataByMonth).forEach(mRows => rows = rows.concat(mRows));
      } else {
        rows = dataByMonth[month] || [];
      }
      if (srv !== "ALL") rows = rows.filter(r => r.srv === srv);
      if (pod !== "ALL") rows = rows.filter(r => r.pod === pod);
      return rows;
    }

    function applyGlobalFilters() {
      activeMonth = document.getElementById("mainMonthSelect").value;
      activeService = document.getElementById("serviceFilter").value;
      activePod = document.getElementById("podFilter").value;

      updateKPIsAndTrends();
      renderTableData();
      
      const chartContainer = document.getElementById("summaryChartContainer");
      if (activeMonth === "ALL") {
        chartContainer.style.display = "block";
        renderLineChart();
      } else {
        chartContainer.style.display = "none";
      }
    }

    function getTrendHTML(cur, prev, show) {
      if (!show) return "";
      if (prev === 0 && cur === 0) return `<span class="trend-badge neutral">0%</span>`;
      if (prev === 0) return `<span class="trend-badge up">▲ 100%</span>`;
      const pct = Math.round(((cur - prev) / prev) * 100);
      if (pct > 0) return `<span class="trend-badge up">▲ ${pct}%</span>`;
      if (pct < 0) return `<span class="trend-badge down">▼ ${Math.abs(pct)}%</span>`;
      return `<span class="trend-badge neutral">0%</span>`;
    }

    function updateKPIsAndTrends() {
      const currentRows = getFilteredRows(activeMonth, activeService, activePod);
      let curBkgs = currentRows.length, curCntrs = 0, curTeus = 0, curMargin = 0;
      currentRows.forEach(r => { curCntrs += r.cntrs; curTeus += r.teus; curMargin += r.margin; });

      let prevBkgs = 0, prevCntrs = 0, prevTeus = 0, prevMargin = 0;
      let showTrend = false;

      if (activeMonth !== "ALL") {
        const availableMonths = MONTH_ORDER.filter(m => dataByMonth[m]);
        const currIdx = availableMonths.indexOf(activeMonth);
        if (currIdx > 0) {
          const prevMonth = availableMonths[currIdx - 1];
          const prevRows = getFilteredRows(prevMonth, activeService, activePod);
          prevBkgs = prevRows.length;
          prevRows.forEach(r => { prevCntrs += r.cntrs; prevTeus += r.teus; prevMargin += r.margin; });
          showTrend = true;
        }
      }

      document.getElementById("statCount").textContent = curBkgs.toLocaleString();
      document.getElementById("statContainers").textContent = Math.round(curCntrs).toLocaleString();
      document.getElementById("statVolume").textContent = Math.round(curTeus).toLocaleString();
      document.getElementById("statMargin").textContent = "$" + Math.round(curMargin).toLocaleString();

      document.getElementById("trendBkgs").innerHTML = getTrendHTML(curBkgs, prevBkgs, showTrend);
      document.getElementById("trendCntrs").innerHTML = getTrendHTML(curCntrs, prevCntrs, showTrend);
      document.getElementById("trendTeus").innerHTML = getTrendHTML(curTeus, prevTeus, showTrend);
      document.getElementById("trendProfit").innerHTML = getTrendHTML(curMargin, prevMargin, showTrend);

      const yieldPerCntr = curCntrs > 0 ? Math.round(curMargin / curCntrs) : 0;
      document.getElementById("statYield").textContent = `YIELD: $${yieldPerCntr.toLocaleString()} / CNTR`;
    }

    function setSortBy(s) {
      sortBy = s;
      ["teu", "profit"].forEach(k => {
        document.getElementById(`sort-${k}`).classList.toggle("active", k === s);
      });
      renderTableData();
    }

    function renderTableData() {
      const groupBy = document.getElementById("groupBySelect").value;
      const headerNameEl = document.getElementById("colHeaderName");

      if (groupBy === "party") headerNameEl.textContent = "Customer Name";
      else if (groupBy === "pod") headerNameEl.textContent = "POD (Port)";
      else if (groupBy === "vsl") headerNameEl.textContent = "Vessel Name";
      else if (groupBy === "srv") headerNameEl.textContent = "Service";
      else if (groupBy === "type") headerNameEl.textContent = "Container Type";

      const rows = getFilteredRows(activeMonth, activeService, activePod);
      const aggregatedMap = {};

      rows.forEach(item => {
        let groupKey = item.party;
        if (groupBy === "pod") groupKey = item.pod;
        if (groupBy === "vsl") groupKey = item.vsl;
        if (groupBy === "srv") groupKey = item.srv;
        if (groupBy === "type") groupKey = item.type;

        if (!aggregatedMap[groupKey]) {
          aggregatedMap[groupKey] = { name: groupKey, bookings: 0, cntrs: 0, teus: 0, profit: 0 };
        }
        aggregatedMap[groupKey].bookings += 1;
        aggregatedMap[groupKey].cntrs += item.cntrs;
        aggregatedMap[groupKey].teus += item.teus;
        aggregatedMap[groupKey].profit += item.margin;
      });

      const sortedArray = Object.values(aggregatedMap).sort((a, b) => {
        return sortBy === "profit" ? (b.profit - a.profit) : (b.teus - a.teus);
      });

      const tableHtml = sortedArray.map(c => {
        const yieldVal = c.cntrs > 0 ? Math.round(c.profit / c.cntrs) : 0;
        return `
        <tr>
          <td>${c.name}</td>
          <td style="color: var(--accent);">${c.bookings}</td>
          <td style="color: var(--text);">${Math.round(c.cntrs)}</td>
          <td style="color: var(--purple);">${Math.round(c.teus)}</td>
          <td>
            <span class="cell-main" style="color: var(--green);">$${Math.round(c.profit).toLocaleString()}</span>
            <span class="cell-sub">$${yieldVal.toLocaleString()}/c</span>
          </td>
        </tr>`;
      }).join("");

      document.getElementById("customerTableBody").innerHTML = tableHtml || `<tr><td colspan="5" style="text-align:center; color: var(--subtext); padding: 20px;">No data available</td></tr>`;
    }

    function renderLineChart() {
      if (activeMonth !== "ALL") return;

      const metric = document.getElementById("chartMetricSelect").value;
      const labels = [];
      const dataPoints = [];
      const availableMonths = MONTH_ORDER.filter(m => dataByMonth[m]);

      availableMonths.forEach(m => {
        labels.push(m);
        let sum = 0;
        const mRows = getFilteredRows(m, activeService, activePod);
        mRows.forEach(row => {
          if (metric === 'teus') sum += row.teus;
          else if (metric === 'profit') sum += row.margin;
          else if (metric === 'cntrs') sum += row.cntrs;
          else if (metric === 'bookings') sum += 1;
        });
        dataPoints.push(Math.round(sum));
      });

      const ctx = document.getElementById("lineChart").getContext("2d");
      if (lineChartInstance) lineChartInstance.destroy();

      let color = "#0a84ff"; 
      if (metric === 'profit') color = "#30d158"; 
      else if (metric === 'teus') color = "#bf5af2"; 
      else if (metric === 'cntrs') color = "#ff9f0a"; 

      lineChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: metric.toUpperCase(),
            data: dataPoints,
            borderColor: color,
            backgroundColor: color + '26', 
            borderWidth: 3,
            pointBackgroundColor: color,
            pointRadius: 4,
            fill: true,
            tension: 0.3 
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: '#38383a' }, ticks: { color: '#8e8e93', font: { size: 10 } }, beginAtZero: true },
            x: { grid: { display: false }, ticks: { color: '#8e8e93', font: { size: 10 } } }
          }
        }
      });
    }

    document.getElementById("summaryChartContainer").style.display = "block";
    setInterval(fetchMasterSheet, 5 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchMasterSheet(); });
    window.addEventListener("DOMContentLoaded", fetchMasterSheet);
  </script>
</body>
</html>
