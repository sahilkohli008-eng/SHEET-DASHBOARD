<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Tracker</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Live Tracker" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #162032;
      --accent: #38bdf8;
      --green: #34d399;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #243248;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .status {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-top: 2px;
    }
    button.refresh-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.refresh-btn:active { opacity: 0.6; }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    select.custom-select {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 15px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid var(--border);
    }
    .stat-card .label {
      font-size: 0.65rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }
    .stat-card .value {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 5px;
      color: var(--accent);
    }
    .stat-card .value.margin-val { color: var(--green); }

    .chart-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .chart-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      width: 100%;
    }
    canvas {
      max-width: 100%;
      max-height: 310px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Live Tracker</h1>
      <div class="status" id="lastUpdated">Updating...</div>
    </div>
    <button class="refresh-btn" onclick="fetchAllWorkbooks()">↻ Refresh</button>
  </header>

  <div class="controls-grid">
    <select class="custom-select" id="monthSelect" onchange="renderActiveData()">
      <option value="ALL">All Sheets & Tabs</option>
    </select>

    <select class="custom-select" id="groupBySelect" onchange="renderActiveData()">
      <option value="party">By Party Name</option>
      <option value="pod">By POD (Port)</option>
      <option value="vsl">By Vessel</option>
    </select>
  </div>

  <div class="card-grid">
    <div class="stat-card">
      <div class="label">BOOKINGS</div>
      <div class="value" id="statCount">--</div>
    </div>
    <div class="stat-card">
      <div class="label">VOLUME / QTY</div>
      <div class="value" id="statVolume">--</div>
    </div>
    <div class="stat-card">
      <div class="label">TOTAL MARGIN</div>
      <div class="value margin-val" id="statMargin">--</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title" id="chartTitle">Breakdown</div>
    <canvas id="pieChart"></canvas>
  </div>

  <script>
    // =========================================================================
    // PASTE YOUR TWO PUBLISHED GOOGLE SHEET LINKS RIGHT HERE:
    // =========================================================================
    const WORKBOOK_URLS = [
      { prefix: "Sheet 1", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSA7Ust8ut8lwSDfgzbacQ3biTKRy5YBNWY87cfGJp4JOKEsGx1kEjQcnEn1xuhKxzlZVtBNzfQTFaO/pub?output=csv" },
      { prefix: "Sheet 2", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoSpmbzsEN8-Vxcg1DqZNLcmN-V8Yy3P10YyTGDk2yegMLRfSG2qCgS44_hRm2sAUh3A7aNvOQP9jU/pub?output=xlsx" }
    ];

    let loadedDataByTab = {};
    let chartInstance = null;

    function toMultiTabUrl(rawUrl) {
      if (!rawUrl || rawUrl.includes("PASTE_")) return "";
      const base = rawUrl.split("?")[0];
      return `${base}?output=xlsx&_cb=${Date.now()}`;
    }

    async function fetchWorkbook(wbConfig) {
      const liveUrl = toMultiTabUrl(wbConfig.url);
      if (!liveUrl) return {};

      const resp = await fetch(liveUrl);
      const arrayBuffer = await resp.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: "array" });

      const tabsData = {};
      workbook.SheetNames.forEach(sheetName => {
        const sheet = workbook.Sheets[sheetName];
        const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (rawRows.length < 2) return;

        const headers = rawRows[0].map(h => String(h).trim().toLowerCase());
        const findCol = (keywords, fallbackIdx) => {
          const idx = headers.findIndex(h => keywords.some(k => h.includes(k)));
          return idx !== -1 ? idx : fallbackIdx;
        };

        const bookIdx = findCol(["booking", "bkg", "bl", "sr"], 1);
        const vslIdx = findCol(["vsl", "vessel"], 2);
        const partyIdx = findCol(["party", "customer", "shipper", "forwarder", "client", "name"], 4);
        const volIdx = findCol(["vol", "qty", "teu", "cntr", "container", "count"], 6);
        const podIdx = findCol(["pod", "port", "dest", "discharge"], 8);
        const marginIdx = findCol(["margin", "profit", "net"], 11);

        const normalizedRows = [];
        for (let i = 1; i < rawRows.length; i++) {
          const r = rawRows[i];
          const bookingVal = String(r[bookIdx] || "").trim();
          const partyVal = String(r[partyIdx] || "").trim();
          if (!bookingVal && !partyVal) continue;
          if (partyVal.toLowerCase().includes("total")) continue;

          normalizedRows.push({
            vsl: String(r[vslIdx] || "Unknown").trim().toUpperCase(),
            party: (partyVal || "Unknown").toUpperCase(),
            vol: parseFloat(String(r[volIdx]).replace(/,/g, "")) || 1,
            pod: String(r[podIdx] || "Unknown").trim().toUpperCase(),
            margin: parseFloat(String(r[marginIdx]).replace(/,/g, "")) || 0
          });
        }

        if (normalizedRows.length > 0) {
          const activeWorkbooks = WORKBOOK_URLS.filter(w => toMultiTabUrl(w.url) !== "").length;
          const tabLabel = activeWorkbooks > 1 ? `${wbConfig.prefix}: ${sheetName}` : sheetName;
          tabsData[tabLabel] = normalizedRows;
        }
      });
      return tabsData;
    }

    async function fetchAllWorkbooks() {
      const statusEl = document.getElementById("lastUpdated");
      statusEl.textContent = "Refreshing...";

      try {
        const results = await Promise.all(WORKBOOK_URLS.map(wb => fetchWorkbook(wb)));
        loadedDataByTab = {};
        results.forEach(tabMap => {
          Object.assign(loadedDataByTab, tabMap);
        });

        updateDropdown(Object.keys(loadedDataByTab));
        renderActiveData();

        const now = new Date();
        statusEl.textContent = `Updated: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Make sure 'Entire Document' is published";
      }
    }

    function updateDropdown(tabNames) {
      const select = document.getElementById("monthSelect");
      const previousValue = select.value;

      select.innerHTML = '<option value="ALL">All Sheets & Tabs Combined</option>';
      tabNames.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });

      if (tabNames.includes(previousValue)) {
        select.value = previousValue;
      }
    }

    function renderActiveData() {
      const selectedTab = document.getElementById("monthSelect").value;
      const groupBy = document.getElementById("groupBySelect").value;

      let rows = [];
      if (selectedTab === "ALL") {
        Object.values(loadedDataByTab).forEach(tRows => {
          rows = rows.concat(tRows);
        });
      } else {
        rows = loadedDataByTab[selectedTab] || [];
      }

      let totalBookings = rows.length;
      let totalVolume = 0;
      let totalMargin = 0;
      const breakdownMap = {};

      rows.forEach(item => {
        totalVolume += item.vol;
        totalMargin += item.margin;

        let key = item.party;
        if (groupBy === "pod") key = item.pod;
        if (groupBy === "vsl") key = item.vsl;

        breakdownMap[key] = (breakdownMap[key] || 0) + item.vol;
      });

      document.getElementById("statCount").textContent = totalBookings.toLocaleString();
      document.getElementById("statVolume").textContent = Math.round(totalVolume).toLocaleString();
      document.getElementById("statMargin").textContent = "$" + Math.round(totalMargin).toLocaleString();

      const sortedEntries = Object.entries(breakdownMap).sort((a, b) => b[1] - a[1]);
      const topEntries = sortedEntries.slice(0, 8);
      const otherEntries = sortedEntries.slice(8);

      const labels = topEntries.map(e => e[0]);
      const values = topEntries.map(e => e[1]);

      if (otherEntries.length > 0) {
        const otherSum = otherEntries.reduce((acc, curr) => acc + curr[1], 0);
        labels.push("OTHER");
        values.push(otherSum);
      }

      const tabTitle = selectedTab === "ALL" ? "All Combined" : selectedTab;
      const groupTitle = groupBy === "party" ? "Party" : (groupBy === "pod" ? "POD" : "Vessel");
      document.getElementById("chartTitle").textContent = `${tabTitle} — Volume by ${groupTitle}`;

      updateChart(labels, values);
    }

    function updateChart(labels, values) {
      const ctx = document.getElementById("pieChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: [
              "#38bdf8", "#818cf8", "#f472b6", "#fbbf24", 
              "#34d399", "#a78bfa", "#f87171", "#2dd4bf", "#64748b"
            ],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          cutout: "58%",
          plugins: {
            legend: {
              position: "bottom",
              labels: { color: "#94a3b8", font: { size: 10 }, boxWidth: 12, padding: 10 }
            }
          }
        }
      });
    }

    setInterval(fetchAllWorkbooks, 5 * 60 * 1000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchAllWorkbooks();
    });
    window.addEventListener("DOMContentLoaded", fetchAllWorkbooks);
  </script>
</body>
</html>
